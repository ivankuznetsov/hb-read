name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install jq shellcheck

      - name: Run tests
        run: ./tests/run.sh

      - name: Run ShellCheck
        run: shellcheck bin/hb-read install.sh skills/honeybadger-read/scripts/hb-read tests/run.sh
